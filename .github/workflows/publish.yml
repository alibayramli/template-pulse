name: Publish npm release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: template_pulse_test
          POSTGRES_PASSWORD: template_pulse_test
          POSTGRES_DB: template_pulse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify release tag
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "::error::Release tag must match package.json version v${version}"
            exit 1
          fi
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn backstage-cli repo fix --check --publish
      - run: yarn verify:release
      - name: Verify PostgreSQL history
        run: yarn workspace @abayramli/backstage-plugin-scaffolder-backend-module-template-pulse test --watch=false --runInBand src/historyStore.test.ts
        env:
          TEMPLATE_PULSE_TEST_POSTGRES_URL: postgresql://template_pulse_test:template_pulse_test@localhost:5432/template_pulse_test
      - name: Check consumer and block high or critical advisories
        run: yarn check:consumer --enforce
      - name: Publish verified archives in dependency order using npm OIDC
        # First publish: npm login locally, then publish the verified archives (docs/publishing.md).
        # On npmjs.com, configure EACH package's Settings > Trusted publishing:
        # GitHub Actions; owner alibayramli; repo template-pulse; workflow publish.yml;
        # environment blank; allow npm publish. Node 24 includes the required npm >=11.5.1.
        # OIDC uses id-token: write above; no NPM_TOKEN or NODE_AUTH_TOKEN secret is needed.
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag=latest
          if [[ "$version" == *-* ]]; then tag=next; fi
          for package in \
            template-pulse-common \
            template-pulse-node \
            scaffolder-backend-module-template-pulse \
            template-pulse-backend \
            template-pulse; do
            npm publish "./artifacts/abayramli-backstage-plugin-${package}-${version}.tgz" \
              --access public --tag "$tag" --provenance --registry=https://registry.npmjs.org
          done
