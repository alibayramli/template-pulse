name: Verify packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: template_pulse_test
          POSTGRES_PASSWORD: template_pulse_test
          POSTGRES_DB: template_pulse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn backstage-cli repo fix --check --publish
      - run: yarn verify:release
      - name: Verify consumer installation and record advisories
        if: matrix.node == 24
        run: yarn check:consumer
      - name: Verify PostgreSQL history
        run: yarn workspace @abayramli/backstage-plugin-scaffolder-backend-module-template-pulse test --watch=false --runInBand src/historyStore.test.ts
        env:
          TEMPLATE_PULSE_TEST_POSTGRES_URL: postgresql://template_pulse_test:template_pulse_test@localhost:5432/template_pulse_test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages-node-${{ matrix.node }}
          path: artifacts/
